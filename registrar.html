<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
   <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">Crear cuenta</h2>

                    <form method="POST" action="guardar.php">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo:</label>
                            <input type="text" name="nombre" id="nombre" class="form-control" maxlength="100" placeholder="Nombre Apellido" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo:</label>
                            <input type="email" name="correo" id="correo" class="form-control" maxlength="100" 	placeholder="Ej: ana@correo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="clave" class="form-label">Contraseña:</label>
                            <input type="password" name="clave" id="clave" class="form-control" minlength="8" maxlength="20" required>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <input type="submit" value="Quiero Registrarme" class="btn btn-primary">
                        </div>
                    </form>

                    <p class="text-center mt-3">¿Ya tienes cuenta? <a href="login.php">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
